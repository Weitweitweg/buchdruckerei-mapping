name: blender-render
on:
  push:
    paths: ['blender/job.json']
  workflow_dispatch:
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      job: ${{ steps.m.outputs.job }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'P'
          import json, os
          j = json.load(open('blender/job.json'))
          s, e, n = j['start'], j['end'], j['chunks']
          step = (e - s + 1 + n - 1) // n
          ch = [{'fs': a, 'fe': min(e, a + step - 1)} for a in range(s, e + 1, step)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'include': ch}) + '\n')
              f.write('job=' + json.dumps(j) + '\n')
          P
  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libglu1-mesa > /dev/null
      - name: blender
        run: |
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          mkdir bl && tar -xf b.tar.xz -C bl --strip-components=1
      - name: render
        env:
          FS: ${{ matrix.fs }}
          FE: ${{ matrix.fe }}
          RW: ${{ fromJson(needs.plan.outputs.job).w }}
          RH: ${{ fromJson(needs.plan.outputs.job).h }}
          SAMPLES: ${{ fromJson(needs.plan.outputs.job).samples }}
          OUT: ${{ github.workspace }}/out/
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./bl/blender -b blender/$(python3 -c "import json;print(json.load(open('blender/job.json'))['blend'])") --gpu-backend opengl --python blender/render_chunk.py > log.txt 2>&1 || true
          grep -E "CHUNK_TIME|Traceback|Error" log.txt | head -20 > out/_log_${FS}.txt || true
          ls out | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.fs }}
          path: out/
          retention-days: 3
  assemble:
    needs: [plan, render]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: frames
          merge-multiple: true
      - name: encode
        run: |
          TAG=$(python3 -c "import json;print(json.load(open('blender/job.json'))['tag'])")
          mkdir -p media/blender
          cat frames/_log_*.txt > media/blender/${TAG}_log.txt || true
          ls frames | grep -c jpg >> media/blender/${TAG}_log.txt
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -y -framerate 24 -pattern_type glob -i 'frames/f_*.jpg' -c:v libx264 -crf 20 -pix_fmt yuv420p media/blender/${TAG}.mp4 || true
          ls -la media/blender
      - name: commit
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add media/blender
          git commit -m "Render-Ergebnis $(python3 -c "import json;print(json.load(open('blender/job.json'))['tag'])")" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
